# Audio sink priorities
#
# Goal: never auto-select the silent S/PDIF (iec958) port as default.
# Prefer analog speakers/headphones if connected, otherwise HDMI to monitor.
# When the currently-default sink becomes unavailable (e.g. HDMI cable
# unplugged, headphones removed from analog jack), wireplumber will
# automatically switch to the highest-priority remaining sink.

monitor.alsa.rules = [
  # Demote S/PDIF optical — nothing connected, picking it = silence.
  {
    matches = [
      { node.name = "~alsa_output\\..*\\.iec958-.*" }
    ]
    actions = {
      update-props = {
        priority.driver  = 100
        priority.session = 100
      }
    }
  }
  # HDMI to monitor — useful when headphones are plugged into the monitor.
  {
    matches = [
      { node.name = "~alsa_output\\..*\\.hdmi-.*" }
    ]
    actions = {
      update-props = {
        priority.driver  = 1500
        priority.session = 1500
      }
    }
  }
  # Motherboard analog jack — highest priority when something is plugged in.
  {
    matches = [
      { node.name = "~alsa_output\\..*\\.analog-.*" }
    ]
    actions = {
      update-props = {
        priority.driver  = 2000
        priority.session = 2000
      }
    }
  }
]
