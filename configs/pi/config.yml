# oh-my-pi (omp) global settings — personal-machine profile.
# NOTE: on work machines ~/.dots-work/configs/pi shadows this entire directory
# (both repos link .omp/agent -> pi; the overlay wins). Edit the overlay there.
# Docs: https://github.com/can1357/oh-my-pi/blob/main/docs/settings.md

disabledProviders:
  - agents-md
  - claude
  - codex
  - gemini
  - opencode
  - github
  - agents

modelRoles:
  default: github-copilot/claude-opus-4.8
  plan: github-copilot/claude-opus-4.8
  smol: anthropic/claude-haiku-4-5

tools:
  approvalMode: yolo

lsp:
  enabled: true
  diagnosticsOnWrite: true

theme:
  dark: titanium

statusLine:
  preset: minimal
  separator: none
  transparent: true
  sessionAccent: false
  showHookStatus: false

display:
  shimmer: disabled

hideThinkingBlock: true

startup:
  quiet: true
