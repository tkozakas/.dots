[general]
live_config_reload = true

[env]
TERM = "xterm-256color"

# Default terminal colors (classic dark)
[colors.primary]
background = "#1c1c1c"
foreground = "#c0c0c0"

[colors.cursor]
text = "#1c1c1c"
cursor = "#c0c0c0"

[colors.selection]
text = "CellForeground"
background = "#3a3a3a"

[colors.normal]
black   = "#000000"
red     = "#cc0000"
green   = "#4e9a06"
yellow  = "#c4a000"
blue    = "#3465a4"
magenta = "#75507b"
cyan    = "#06989a"
white   = "#d3d7cf"

[colors.bright]
black   = "#555753"
red     = "#ef2929"
green   = "#8ae234"
yellow  = "#fce94f"
blue    = "#729fcf"
magenta = "#ad7fa8"
cyan    = "#34e2e2"
white   = "#eeeeec"

[terminal]
osc52 = "CopyPaste"
shell = { program = "/bin/zsh", args = ["-l", "-c", "tmux new-session -A -s main"] }

[window]
decorations = "Buttonless"
startup_mode = "Maximized"
dynamic_title = true
opacity = 1.0
padding = { x = 6, y = 6 }
option_as_alt = "Both"

[[keyboard.bindings]]
key = "Return"
mods = "Command"
action = "ToggleFullscreen"

[scrolling]
history = 10000
multiplier = 3

[font]
size = 14.0

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[cursor.style]
shape = "Block"
blinking = "Off"

[mouse]
hide_when_typing = true

[selection]
save_to_clipboard = true

