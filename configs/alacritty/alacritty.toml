[general]
live_config_reload = true
import = ["~/.config/alacritty/theme.toml"]

[env]
TERM = "xterm-256color"

[terminal]
osc52 = "CopyPaste"
shell = { program = "/bin/zsh", args = ["-l", "-c", "tmux new-session -A -s main"] }

[window]
decorations = "Buttonless"
startup_mode = "Maximized"
dynamic_title = true
opacity = 1.0
padding = { x = 6, y = 6 }
option_as_alt = "Both"

[[keyboard.bindings]]
key = "Return"
mods = "Command"
action = "ToggleFullscreen"

[scrolling]
history = 10000
multiplier = 3

[font]
size = 14.0

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[cursor.style]
shape = "Block"
blinking = "Off"

[mouse]
hide_when_typing = true

[selection]
save_to_clipboard = true

