unbind-key C-b
set-option -g prefix C-a
bind-key C-a send-prefix
set -g set-clipboard on
set -g mouse on
set -g allow-passthrough on

# True color + undercurl support
set -g default-terminal "tmux-256color"
set -sa terminal-overrides ",xterm*:Tc"
set -sa terminal-overrides ',*:Smulx=\E[4::%p1%dm'   # undercurl
set -sa terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underline color

# Performance optimizations
set -sg escape-time 0                    # Remove ESC delay (critical for vim)
set -g focus-events on                   # Pass focus events to applications
set -g aggressive-resize on              # Resize windows aggressively
set -g history-limit 10000               # Scrollback buffer
set -g status-interval 5                 # Update status every 5s (not default 1s)
set -g repeat-time 300                   # Allow repeated keys within 300ms

set-window-option -g pane-base-index 1

set-option -g base-index 1
set-option -g renumber-windows on

# Pane management
bind-key r split-window -h -c "#{pane_current_path}"
bind-key v split-window -v -c "#{pane_current_path}"
bind-key q kill-pane

# Pane navigation (vim-tmux-navigator: seamless Ctrl-hjkl between tmux and nvim)
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R

# Pane resizing
bind-key -r H resize-pane -L 500
bind-key -r J resize-pane -D 500
bind-key -r K resize-pane -U 500
bind-key -r L resize-pane -R 500

# Fine-grained pane resizing
bind-key -r C-h resize-pane -L 5
bind-key -r C-j resize-pane -D 5
bind-key -r C-k resize-pane -U 5
bind-key -r C-l resize-pane -R 5

# Pane swapping
bind-key > swap-pane -D
bind-key < swap-pane -U

# Window management
bind-key c new-window -c "#{pane_current_path}"  # New window in current path
bind-key w choose-window                          # Interactive window selection
bind-key Q kill-window
bind-key X confirm-before -p "Kill window? (y/n)" kill-window

# Session management
bind-key N new-session                            # Create new session
bind-key S choose-session                         # Switch sessions

# Reload config
bind-key % source ~/.tmux.conf \; display-message "Config reloaded!"

# Theme colors (sourced from theme picker)
source-file ~/.config/current-theme/tmux.conf

# Status bar
set -g status-position top
set -g status-justify left
set -g status-style "bg=#{TH_BG},fg=#{TH_FG}"
set -g status-left-length 40
set -g status-right-length 80

# Left: session name
set -g status-left "#[fg=#{TH_BLACK},bg=#{TH_BLUE},bold]  #S #[fg=#{TH_BLUE},bg=#{TH_BG}] "

# Right: directory · git branch · time
set -g status-right "#[fg=#{TH_GUTTER},bg=#{TH_BG}]#[fg=#{TH_FG},bg=#{TH_GUTTER}]  #(basename #{pane_current_path}) #[fg=#{TH_COMMENT},bg=#{TH_GUTTER}]#[fg=#{TH_GREEN},bg=#{TH_COMMENT}]  #(cd #{pane_current_path} && git branch --show-current 2>/dev/null || echo '-') #[fg=#{TH_BLUE},bg=#{TH_COMMENT}]#[fg=#{TH_BLACK},bg=#{TH_BLUE},bold]  %H:%M "

# Window tabs
set -g window-status-separator ""
set -g window-status-format "#[fg=#{TH_BG},bg=#{TH_BG}]#[fg=#{TH_COMMENT},bg=#{TH_BG}] #I  #W #[fg=#{TH_BG},bg=#{TH_BG}]"
set -g window-status-current-format "#[fg=#{TH_BG},bg=#{TH_GUTTER}]#[fg=#{TH_CYAN},bg=#{TH_GUTTER},bold] #I  #W #[fg=#{TH_GUTTER},bg=#{TH_BG}]"

# Pane borders
set -g pane-border-style "fg=#{TH_GUTTER}"
set -g pane-active-border-style "fg=#{TH_BLUE}"

# Message style
set -g message-style "fg=#{TH_CYAN},bg=#{TH_BLACK},bold"
set -g message-command-style "fg=#{TH_CYAN},bg=#{TH_BLACK}"

# Mode (copy mode) style
set -g mode-style "fg=#{TH_BLACK},bg=#{TH_CYAN}"

# Project/file navigation
bind-key n run-shell "~/.tmux/scripts/project-switcher.sh"
bind-key C-f run-shell "~/.tmux/scripts/tmux-sessionizer.sh"          # Session switcher
bind-key g new-window -c "#{pane_current_path}" "lazygit"

# OpenCode integration - prefix+o: open in side pane
bind-key o run-shell "~/.tmux/scripts/opencode-launcher.sh"

# k9s - prefix+k
bind-key k new-window "k9s"

# Agent monitor - prefix+a (attach to running opencode sessions in tiled panes)
bind-key a run-shell 'port=$(cat /tmp/opencode-port 2>/dev/null); if [ -n "$port" ]; then tmux new-window -n opencode "OPENCODE_PORT=$port agent-monitor"; else tmux display-message "No opencode server running"; fi'

# Work function picker - prefix+m
bind-key m run-shell "~/.dots-work/scripts/function-picker.sh"

# Quick layout switching
bind-key M-1 select-layout even-horizontal
bind-key M-2 select-layout even-vertical
bind-key M-3 select-layout main-horizontal
bind-key M-4 select-layout main-vertical
bind-key M-5 select-layout tiled

# Pane synchronization toggle (type in all panes at once)
bind-key s set-window-option synchronize-panes\; display-message "Panes sync: #{?synchronize-panes,ON,OFF}"

# Vi copy mode
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
