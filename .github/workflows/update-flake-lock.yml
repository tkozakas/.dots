name: update-flake-lock

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Update flake.lock
        id: update
        uses: DeterminateSystems/update-flake-lock@main
        with:
          pr-title: "Update flake.lock"

      - name: Approve pending checks on the update branch
        if: steps.update.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: update_flake_lock_action
        run: |
          for _ in $(seq 1 10); do
            runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=$BRANCH&status=action_required" --jq '.workflow_runs[].id')
            if [ -n "$runs" ]; then
              for id in $runs; do
                gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/approve"
              done
              exit 0
            fi
            sleep 10
          done
          gh workflow run check.yml --ref "$BRANCH"
